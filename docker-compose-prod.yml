services:
  xpanelnode:
    image: xpanel/node:latest
    container_name: xpanelnode
    hostname: xpanelnode
    network_mode: host
    restart: always
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      - NODE_PORT=2222
      - SECRET_KEY=""
